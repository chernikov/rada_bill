name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - develop
      - feature/deployment
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0955618410
  REGION: europe-west3
  SERVICE_NAME: bills-analyzer
  REPOSITORY: cloud-run-source-deploy

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
      
      - name: Get or Set Service URL
        id: service-url
        run: |
          # Try to get existing service URL first
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)' 2>/dev/null || echo "")
          
          # If service doesn't exist, construct expected URL
          if [ -z "$SERVICE_URL" ]; then
            echo "Service not found, will be created"
            SERVICE_URL="https://${{ env.SERVICE_NAME }}-ahys7wglfa-${{ env.REGION }}.a.run.app"
          fi
          
          # Trim any whitespace/newlines from SERVICE_URL
          SERVICE_URL=$(echo "$SERVICE_URL" | tr -d '\n' | tr -d '\r' | xargs)
          WEBHOOK_URL="$SERVICE_URL/api/telegram/webhook"
          
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "WEBHOOK_URL=$WEBHOOK_URL" >> $GITHUB_OUTPUT
          echo "Service URL: $SERVICE_URL"
          echo "Webhook URL: $WEBHOOK_URL"
      
      - name: Create .env.production file
        run: |
          # Use only echo to avoid heredoc newline issues
          echo "# Production Environment Variables" > .env.production
          echo "DEBUG=false" >> .env.production
          echo "" >> .env.production
          echo "# Google Cloud Configuration" >> .env.production
          echo "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" >> .env.production
          echo "GCP_PROJECT_ID=${{ env.PROJECT_ID }}" >> .env.production
          echo "FIRESTORE_DATABASE=(default)" >> .env.production
          echo "" >> .env.production
          echo "# API Configuration" >> .env.production
          echo "API_HOST=0.0.0.0" >> .env.production
          echo "API_PORT=8080" >> .env.production
          echo "" >> .env.production
          echo "# AI Model Configuration" >> .env.production
          echo "GEMINI_MODEL=gemini-2.0-flash-exp" >> .env.production
          echo "GEMINI_TEMPERATURE=0.7" >> .env.production
          echo "GEMINI_MAX_TOKENS=8000" >> .env.production
          echo "" >> .env.production
          echo "# Secrets (added via echo to prevent newline injection)" >> .env.production
          echo "GEMINI_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env.production
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env.production
          echo "TELEGRAM_WEBHOOK_URL=${{ steps.service-url.outputs.WEBHOOK_URL }}" >> .env.production
          echo "TELEGRAM_SECRET_TOKEN=${{ secrets.TELEGRAM_SECRET_TOKEN }}" >> .env.production
          
          # Display file for debugging
          echo "Generated .env.production:"
          cat .env.production | head -30
      
      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest \
                       .
      
      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
      
      - name: Create secrets in Secret Manager (if not exist)
        continue-on-error: true
        run: |
          # Create GEMINI_API_KEY secret
          echo -n "${{ secrets.GOOGLE_API_KEY }}" | gcloud secrets create GEMINI_API_KEY \
            --data-file=- \
            --replication-policy=automatic \
            || gcloud secrets versions add GEMINI_API_KEY --data-file=- <<< "${{ secrets.GOOGLE_API_KEY }}"
          
          # Create TELEGRAM_BOT_TOKEN secret
          echo -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" | gcloud secrets create TELEGRAM_BOT_TOKEN \
            --data-file=- \
            --replication-policy=automatic \
            || gcloud secrets versions add TELEGRAM_BOT_TOKEN --data-file=- <<< "${{ secrets.TELEGRAM_BOT_TOKEN }}"
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars="DEBUG=false,GCP_PROJECT_ID=${{ env.PROJECT_ID }},FIRESTORE_DATABASE=(default),GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},TELEGRAM_WEBHOOK_URL=${{ steps.service-url.outputs.WEBHOOK_URL }},TELEGRAM_SECRET_TOKEN=${{ secrets.TELEGRAM_SECRET_TOKEN }}" \
            --update-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"
      
      - name: Verify Service URL
        id: verify-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Final Service URL: $SERVICE_URL"
      
      - name: Test Deployment
        run: |
          sleep 10
          curl -f ${{ steps.verify-url.outputs.url }}/health || echo "Health check failed"
          curl -f ${{ steps.verify-url.outputs.url }}/api/bills || echo "API check failed"
      
      - name: Deployment Summary
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.verify-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Webhook**: ${{ steps.service-url.outputs.WEBHOOK_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [Service URL](${{ steps.verify-url.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Health Check](${{ steps.verify-url.outputs.url }}/health)" >> $GITHUB_STEP_SUMMARY
          echo "- [API Docs](${{ steps.verify-url.outputs.url }}/docs)" >> $GITHUB_STEP_SUMMARY
          echo "- [Telegram Webhook](${{ steps.service-url.outputs.WEBHOOK_URL }})" >> $GITHUB_STEP_SUMMARY
